# Dependabot configuration for this crate's repository.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(rust)"
    labels:
      - "dependencies"
    # Only patch releases are grouped; minor bumps are reviewed one by one.
    groups:
      rust-patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  # The fuzz harnesses are a separate workspace with their own lockfile.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(fuzz)"
    labels:
      - "dependencies"
    groups:
      fuzz:
        patterns:
          - "*"

  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "dependencies"
