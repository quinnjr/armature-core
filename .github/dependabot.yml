# Dependabot configuration for this crate's repository.

version: 2
updates:
  # The crate and the fuzz harnesses (a separate workspace with its own
  # lockfile) are one entry, so a bump moves both lockfiles together: the
  # fuzz job builds `--locked`, and a root requirement change landing alone
  # would break it, or leave the fuzzer exercising versions that don't ship.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    # A hijacked release is usually yanked within days; waiting a week keeps a
    # fresh one out of the grouped patch PR.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(rust)"
    labels:
      - "dependencies"
    groups:
      # Patch releases ride together.
      rust-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      # Minor and major bumps are still reviewed one dependency at a time,
      # each as a single PR across both directories.
      rust-per-dependency:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"

  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Same reasoning as for crates: a hijacked action release should be
    # caught and pulled before a pin moves to it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "dependencies"
