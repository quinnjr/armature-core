name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          components: rustfmt, clippy
          toolchain: 1.99.0 # pinned stable; bump deliberately
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      # Matches the framework gate: the whole target graph, warnings denied.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # The hyper HTTP/1.1 transport only compiles without `h1-backend`.
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
