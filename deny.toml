# cargo-deny configuration — run as `cargo deny --all-features check`
# (CI: .github/workflows/audit.yml).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The unpublished fuzz crate depends on this one by path.
allow-wildcard-paths = true
deny = [
    # TLS is rustls-only: native-tls and OpenSSL drag in a C TLS stack.
    { crate = "native-tls", reason = "TLS is rustls-only" },
    { crate = "openssl-sys", reason = "TLS is rustls-only" },
    # The crypto provider is ring, named explicitly at every TLS entry point.
    # aws-lc only arrives through a dependency's default features, and then it
    # is a second C crypto library that is built on every consumer's machine
    # but never called.
    { crate = "aws-lc-sys", reason = "the crypto provider is ring; disable the dependency's default features" },
    { crate = "aws-lc-fips-sys", reason = "the crypto provider is ring" },
    { crate = "aws-lc-rs", reason = "the crypto provider is ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. Dual-licensed crates (e.g. "Apache-2.0 OR
# GPL-2.0-only") pass on their permissive alternative.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
